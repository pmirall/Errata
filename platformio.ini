; =============================================================================
;  PEBBLEBOL - platformio.ini
;
;  *** THIS IS A CONVENIENCE BUILD. IT IS NOT THE ONE THE GATE MEASURES. ***
;
;  tools/build.sh + tools/build_matrix.sh (arduino-cli) are what CI runs and
;  what every size in README.md, docs/budget.md and docs/decisions.md was
;  measured with. This file exists so the firmware can be edited and flashed
;  from VSCode without that round trip. THREE THINGS IT DOES NOT DO, all of
;  which tools/build.sh does, and none of which PlatformIO can be made to do
;  from an ini file:
;
;    1. FAIL ON A PROJECT WARNING. build.sh compiles with --warnings all and
;       fails on any warning whose path points into the sketch. -Wall -Wextra
;       below produces the same warnings and does not fail on them.
;    2. CHECK THE APP CEILING. build.sh asserts the linker's "Maximum is N
;       bytes" equals app0's size in partitions.csv (3,145,728). Decision D6:
;       arduino-cli takes the SIZE CHECK from the board menu and the TABLE
;       from the sketch, and they can disagree silently.
;    3. CHECK THAT nvs2 SURVIVED. build.sh greps the partition table that will
;       actually be flashed for the nvs2 row. See board_build.partitions below
;       for why that is the one line in this file worth reading twice.
;
;  So: edit and flash here, and run `tools/check.sh` before you push. A size
;  quoted from a PlatformIO build is not comparable to GATE_RELEASE_FLASH_MAX
;  - the core version differs (see `platform` below) and docs/budget.md section 8
;  is a phase exit that drew the wrong conclusion from exactly that mistake.
; =============================================================================

[platformio]
; The sketch is Pebblebol/Pebblebol.ino - three lines that call app_setup() and
; app_loop() - plus everything under Pebblebol/src/**. PlatformIO globs src_dir
; recursively, so pointing it at the sketch folder compiles both.
src_dir = Pebblebol
default_envs = baseline

[env]
; ARDUINO CORE 3.x IS NOT OPTIONAL, AND THIS IS THE LINE THAT DECIDES IT.
; hardware/audio.cpp calls ledcAttach(pin, freq, bits) -> bool and
; ledcDetach(pin). Neither exists before core 3.0: core 2.x has
; ledcSetup()/ledcAttachPin() and no detach at all. PlatformIO's OFFICIAL
; platformio/espressif32 platform tops out at core 2.0.17 and CANNOT build this
; firmware - it fails at the link with three undefined references and nothing
; about the error says "wrong core". This is the community fork that ships 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1

; *** THE ONE LINE THIS FILE EXISTS FOR (decision D6). ***
; nvs2 is a SECOND, PRIVATE NVS partition that the Arduino core never touches.
; initArduino() erases the whole standard "nvs" partition whenever
; nvs_flash_init() answers NO_FREE_PAGES or NEW_VERSION_FOUND - before setup()
; runs, so no amount of care in this firmware can prevent it - and the
; checkpoint written into nvs2 is what turns that erase from "the pet is gone"
; into LOAD_RECOVERED_CKPT. A stock huge_app table has no nvs2 row. Drop this
; line and everything still compiles, still links, still flashes, still boots,
; and loses the save the first time the core decides to tidy up.
board_build.partitions = Pebblebol/partitions.csv
board_upload.flash_size = 4MB

; Native USB CDC. Copied out of the core's own platform.txt line 83
; (build.extra_flags.esp32c3), which is what the arduino-cli FQBN's
; CDCOnBoot=cdc expands to - not guessed. Without these the C3 enumerates but
; Serial goes to the UART pins and the DIAG console is silent over the cable.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall
  -Wextra

; The exact version tools/build.sh builds against. Pinned rather than floated:
; u8g2 is the only library this firmware has, ui/gfx_u8g2.cpp is welded to its
; setBitmapMode/drawXBM behaviour, and P10-C3 is a whole chunk about the two
; blits disagreeing.
lib_deps = olikraus/U8g2@2.35.30

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- the dev build: the hidden DIAG console over the cable -------------------
[env:baseline]

; --- the artefact that ships -------------------------------------------------
[env:release]
build_flags =
  ${env.build_flags}
  -DGOD_MODE_ENABLED=0
