name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: host tests (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host test suite
        run: make -C tests check

  firmware:
    name: firmware (arduino-cli, esp32c3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache arduino-cli core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.1.1-u8g2-2.35.30
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version
      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1
          arduino-cli lib install "U8g2@2.35.30"
      - name: Gate (build + size caps)
        run: tools/check.sh --no-tests
